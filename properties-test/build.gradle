plugins {
    id 'application'
    id 'idea'
    id("com.diffplug.spotless") version "8.8.0"
    id 'se.anders_raberg.gradle.plugins.propertiesValidation'
    id 'jacoco'
    id("org.gradle.test-retry") version "1.6.6"
}

spotless {
    java {
        eclipse().configFile(layout.projectDirectory.file("java-code-formatter.xml"))
    }
}


group = 'se.anders-raberg.proptest'
version = '1.0-SNAPSHOT'

application {
    mainClass = 'se.anders_raberg.proptest.Main'
}

distributions {
    main {
        contents {
            from 'extraprops'
        }
    }
}

propertiesValidation {
    propertiesFiles.from(getLayout().getProjectDirectory().dir("extraprops").asFileTree)
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.commonsLang
    testImplementation libs.junitJupiterApi
    testImplementation libs.junitJupiterParams
    testRuntimeOnly libs.junitJupiterEngine
    testRuntimeOnly libs.junitPlatformLauncher
}
test {
    useJUnitPlatform()
    retry {
        maxRetries = 10
        maxFailures = 20
        failOnPassedAfterRetry = false
        failOnSkippedAfterRetry = true
    }
}


